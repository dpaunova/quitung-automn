<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Сканиране и управление на касови бележки">
    <title>Beleg Scanner</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
    <div id="app"></div>

    <script src="/js/api.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/pages/login.js"></script>
    <script src="/js/pages/register.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/scan.js"></script>
    <script src="/js/pages/receipts.js"></script>
    <script src="/js/pages/receipt-detail.js"></script>
    <script src="/js/pages/report.js"></script>
    <script src="/js/pages/settings.js"></script>
    <script src="/js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(function(reg) {
                    console.log('Service Worker registered:', reg.scope);
                })
                .catch(function(err) {
                    console.warn('Service Worker registration failed:', err);
                });
        }
    </script>
</body>
</html>
