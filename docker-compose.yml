version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quitung
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quitung
      REDIS_URL: redis://redis:6379
      VLM_ENABLED: "false"
      SECRET_KEY: dev-secret-change-in-production
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    command: arq app.extraction.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quitung
      REDIS_URL: redis://redis:6379
      VLM_ENABLED: "false"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
