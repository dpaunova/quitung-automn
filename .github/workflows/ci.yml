name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      - name: Debug - check imports
        run: |
          python -c "
          import traceback, sys
          try:
              from app.main import app
              print('app import OK')
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          "
          pip list | grep -iE "fastapi|starlette|httpx|uvicorn|sqlalchemy|bcrypt|passlib|reportlab|openpyxl|psycopg2|pydantic|jose|aiosmtplib"
      - run: pytest --cov=app --cov-report=term -v
